<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Route Replay [PRO] — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // ROUTE_REPLAY_PRO</div>
<div class="screen-bg"><img src="../A_high-resolution,_detailed_vertical_image_202606290631.jpeg" alt=""><div class="bg-fade"></div><div class="bg-glow"></div></div>
<div class="scanlines"></div>
        <div class="screen-dark" style="padding:0">
          <div style="flex:1;background:var(--surface-2);position:relative;margin-bottom:0">
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
              <div style="text-align:center">
                <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:2px;margin-bottom:6px">ROUTE MAP</div>
                <div style="font-family:var(--font-mono);font-size:11px;color:var(--matrix)">24 km · 3:32 play time</div>
              </div>
            </div>
            <div style="position:absolute;top:16px;left:16px;font-family:var(--font-mono);font-size:10px;border:1px solid var(--matrix);padding:4px 10px;color:var(--matrix)">PRO</div>
          </div>
          <div style="padding:16px">
            <div style="display:flex;gap:8px;margin-bottom:12px">
              <button style="flex:1;padding:12px;background:var(--matrix);color:var(--void);border:none;font-family:var(--font-mono);font-size:12px;cursor:pointer">▶ PLAY</button>
              <button style="flex:1;padding:12px;background:var(--surface);color:var(--text-dim);border:1px solid var(--border);font-family:var(--font-mono);font-size:12px;cursor:pointer">⏸ PAUSE</button>
            </div>
            <div style="height:4px;background:var(--track);margin-bottom:8px;position:relative">
              <div style="height:100%;width:35%;background:var(--matrix)"></div>
              <div style="position:absolute;left:35%;top:-4px;width:2px;height:12px;background:var(--matrix)"></div>
            </div>
            <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">
              <span>3:32</span><span>10:17</span>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px">
              <div style="text-align:center"><div style="font-family:var(--font-mono);font-size:16px;color:var(--matrix)">91</div><div style="font-size:9px;color:var(--text-dim)">SCORE</div></div>
              <div style="text-align:center"><div style="font-family:var(--font-mono);font-size:16px">118</div><div style="font-size:9px;color:var(--text-dim)">MAX KM/H</div></div>
            </div>
          </div>
        </div>
        <div class="bottom-nav"><button><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="2"/></svg><span class="nav-label">TRACK</span><span class="nav-dot"></span></button><button><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><polyline points="12,6 12,12 16,14"/></svg><span class="nav-label">HISTORY</span><span class="nav-dot"></span></button><button class="active"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4a2 2 0 01-2-2V5a2 2 0 012-2h2"/><path d="M18 9h2a2 2 0 002-2V5a2 2 0 00-2-2h-2"/><path d="M6 3h12v7a6 6 0 01-12 0z"/><path d="M12 16v5"/><path d="M8 21h8"/></svg><span class="nav-label">RANK</span><span class="nav-dot"></span></button><button><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="nav-label">PROFILE</span><span class="nav-dot"></span></button></div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
