<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Username Picker — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // USERNAME_PICKER</div>
<div class="scanlines"></div>
        <div class="screen">
          <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;padding-top:8px">CLAIM YOUR NAME</div>
          <div style="font-family:var(--font-mono);font-size:22px;margin-bottom:24px">Choose your driver tag</div>
          <div style="border:1px solid var(--matrix);padding:14px 16px;margin-bottom:24px;display:flex;align-items:center;gap:12px">
            <span style="font-family:var(--font-mono);font-size:18px;color:var(--white)">@</span>
            <input type="text" value="speedster99" style="flex:1;background:transparent;border:none;outline:none;font-family:var(--font-mono);font-size:18px;color:var(--matrix)">
          </div>
          <div style="font-size:11px;color:var(--matrix);font-family:var(--font-mono);margin-bottom:16px">CHECKING AVAILABILITY...</div>
          <div style="font-size:12px;color:var(--matrix);margin-bottom:24px">@speedster99 is available</div>
          <button class="btn btn-matrix" style="margin-top:auto">CLAIM USERNAME</button>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
