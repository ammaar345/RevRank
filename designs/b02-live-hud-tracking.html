<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live HUD · Tracking — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // LIVE_HUD_TRACKING</div>
<div class="screen-bg"><img src="../A_high-resolution,_detailed_vertical_image_202606290631.jpeg" alt=""><div class="bg-fade"></div><div class="bg-glow"></div></div>
<div class="scanlines"></div>
        <div class="screen-dark">
          <div class="hud-top">
            <div>
              <div class="hud-label">SPEED</div>
              <div class="hud-speed">74 <span>km/h</span></div>
            </div>
            <div style="text-align:right">
              <div class="hud-label">SCORE</div>
              <div class="hud-score">88</div>
            </div>
          </div>
          <div class="hud-map">
            <svg viewBox="0 0 335 300" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%">
              <g stroke="rgba(0,255,65,.06)" stroke-width="1">
                <path d="M0 60H335M0 130H335M0 210H335M0 270H335"/>
                <path d="M50 0V300M140 0V300M225 0V300M300 0V300"/>
              </g>
              <g stroke="rgba(0,255,65,.04)" stroke-width="4">
                <path d="M0 95H335M90 0V300"/>
              </g>
              <path d="M30 265L90 265Q100 265 100 255L100 150Q100 140 110 140L225 140Q235 140 235 130L235 60L300 60" fill="none" stroke="var(--matrix)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px var(--matrix))"/>
              <circle cx="30" cy="265" r="4" fill="none" stroke="var(--matrix)" stroke-width="1.5" opacity=".6"/>
              <circle cx="300" cy="60" r="5" fill="var(--matrix)" style="filter:drop-shadow(0 0 8px var(--matrix))">
                <animate attributeName="r" values="5;6.5;5" dur="2s" repeatCount="indefinite"/>
              </circle>
              <circle cx="300" cy="60" r="10" fill="none" stroke="var(--matrix)" stroke-width="1">
                <animate attributeName="r" values="8;18" dur="2s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values=".5;0" dur="2s" repeatCount="indefinite"/>
              </circle>
            </svg>
            <div style="position:absolute;left:14px;bottom:12px;z-index:2">
              <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:2px;margin-bottom:6px;text-shadow:0 0 4px #000">GPS TRACKING ACTIVE</div>
              <div style="font-family:var(--font-mono);font-size:11px;color:var(--matrix);text-shadow:0 0 4px #000">● LIVE</div>
            </div>
          </div>
          <div class="hud-metrics">
            <div class="hud-metric">
              <div class="hud-metric-top">
                <span class="hud-label">DISTANCE</span>
              </div>
              <div class="hud-metric-val">12.4 <span style="font-size:12px;color:var(--text-dim)">km</span></div>
            </div>
            <div class="hud-metric">
              <div class="hud-metric-top">
                <span class="hud-label">TIME</span>
              </div>
              <div class="hud-metric-val">18:32</div>
            </div>
            <div class="hud-metric">
              <div class="hud-metric-top">
                <span class="hud-label">MAX G</span>
              </div>
              <div class="hud-metric-val" style="color:#FF6B00">0.42G</div>
            </div>
            <div class="hud-metric">
              <div class="hud-metric-top">
                <span class="hud-label">AVG SPEED</span>
              </div>
              <div class="hud-metric-val">58 <span style="font-size:12px;color:var(--text-dim)">km/h</span></div>
            </div>
          </div>
          <button class="hud-btn">END TRIP</button>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
