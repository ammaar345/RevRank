<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Permissions · GPS + BT — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // PERMISSIONS_GPS_BT</div>
<div class="scanlines"></div>
        <div class="screen">
          <div style="font-family:var(--font-mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;padding-top:8px">SETUP</div>
          <div style="font-family:var(--font-mono);font-size:22px;margin-bottom:32px">One last thing</div>
          <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:32px">
            <div style="border:1px solid var(--matrix);padding:16px;display:flex;align-items:center;gap:12px;background:rgba(0,255,65,.03)">
              <div style="width:32px;height:32px;border:1px solid var(--matrix);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--matrix)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;filter:drop-shadow(0 0 4px var(--matrix-glow))"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></div>
              <div style="flex:1">
                <div style="font-family:var(--font-mono);font-size:14px">Location</div>
                <div style="font-size:11px;color:var(--text-dim)">Always required for trip tracking</div>
              </div>
              <div style="font-family:var(--font-mono);font-size:10px;color:var(--matrix)">ENABLED</div>
            </div>
            <div style="border:1px solid var(--border);padding:16px;display:flex;align-items:center;gap:12px">
              <div style="width:32px;height:32px;border:1px solid var(--border);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--text-dim)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M19.07 4.93A10 10 0 002.05 11.5"/><path d="M15.54 8.46A5 5 0 007.02 11.7"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><path d="M12 12l6.5-6.5"/><circle cx="18" cy="14" r="1" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="1" fill="currentColor" stroke="none"/></svg></div>
              <div style="flex:1">
                <div style="font-family:var(--font-mono);font-size:14px">Nearby Devices</div>
                <div style="font-size:11px;color:var(--text-dim)">Auto-start when car Bluetooth detected</div>
              </div>
              <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim)">NOT NOW</div>
            </div>
            <div style="border:1px solid var(--border);padding:16px;display:flex;align-items:center;gap:12px">
              <div style="width:32px;height:32px;border:1px solid var(--border);border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--text-dim)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/><circle cx="17.5" cy="5" r="2" fill="currentColor" stroke="none"/></svg></div>
              <div style="flex:1">
                <div style="font-family:var(--font-mono);font-size:14px">Notifications</div>
                <div style="font-size:11px;color:var(--text-dim)">Challenges, streaks, badges</div>
              </div>
              <div style="font-family:var(--font-mono);font-size:10px;color:var(--matrix)">ALLOW</div>
            </div>
          </div>
          <button class="btn btn-matrix" style="margin-top:auto">CONTINUE</button>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
