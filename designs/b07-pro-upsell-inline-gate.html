<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Upsell · Inline Gate — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // PRO_UPSELL_INLINE_GATE</div>
<div class="screen-bg"><img src="../A_high-resolution,_detailed_vertical_image_202606290631.jpeg" alt=""><div class="bg-fade"></div><div class="bg-glow"></div></div>
<div class="scanlines"></div>
        <div class="screen" style="padding:24px;justify-content:center">
          <!-- Simulated blurred feature behind -->
          <div style="opacity:.2;filter:blur(2px);position:absolute;inset:24px;display:flex;flex-direction:column;gap:12px;pointer-events:none">
            <div style="height:40px;background:var(--surface-2);border-radius:var(--radius-sm)"></div>
            <div style="height:80px;background:var(--surface-2);border-radius:var(--radius-sm)"></div>
            <div style="height:40px;background:var(--surface-2);border-radius:var(--radius-sm)"></div>
            <div style="height:40px;background:var(--surface-2);border-radius:var(--radius-sm)"></div>
          </div>
          <!-- Lock overlay -->
          <div style="background:rgba(0,0,0,.85);border-radius:var(--radius);padding:32px;text-align:center;border:1px solid var(--border);position:relative;z-index:2">
            <div style="font-size:32px;color:var(--matrix);margin-bottom:12px">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--matrix)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:40px;height:40px;animation:lockPulse 2s ease-in-out infinite" role="img" aria-label="Pro locked"><polygon points="12,3 20,7 20,17 12,21 4,17 4,7"/><path d="M9 9V7a3 3 0 016 0v2"/><circle cx="12" cy="12" r="1.4"/><rect x="11.3" y="13.2" width="1.4" height="2.4" rx="0.6" fill="var(--matrix)" stroke="none"/></svg>
            </div>
            <style>
              @keyframes lockPulse{0%,100%{filter:drop-shadow(0 0 4px var(--matrix))}50%{filter:drop-shadow(0 0 12px var(--matrix))}}
            </style>
            <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">PRO FEATURE</div>
            <div style="font-size:12px;color:var(--text-dim);margin-bottom:20px;line-height:1.5">See all your trips, not just the last 10</div>
            <button class="btn btn-matrix" style="font-size:10px;padding:12px">UNLOCK PRO →</button>
          </div>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
