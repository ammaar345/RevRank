<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rank Up · Enforcer — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // RANK_UP_ENFORCER</div>
<div class="scanlines"></div>
        <div class="rankup">
          <div class="rankup-label">NEW RANK UNLOCKED</div>
          <div class="glow-center"></div>
            <div class="rankup-badge"><svg viewBox="0 0 24 24" fill="none" stroke="var(--matrix)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:70px;height:70px;filter:drop-shadow(0 0 20px var(--matrix))"><path d="M12 2l4 2v4l4 2v4l-4 2v4l-4 2-4-2v-4l-4-2v-4l4-2V4z" stroke="var(--matrix)" stroke-width="1.2" fill="rgba(0,255,65,0.08)"/><path d="M12 5l2.5 1.5V9l2.5 1.5v3L14.5 15v2.5L12 19l-2.5-1.5V15l-2.5-1.5v-3L9.5 9V6.5z" stroke="var(--matrix-dim)" stroke-width="0.5" opacity="0.5" fill="none"/><path d="M9 9h6M9 12h6M9 15h4" stroke="var(--matrix)" stroke-width="1.8" fill="none"/><circle cx="12" cy="12" r="10.5" stroke="rgba(0,255,65,0.15)" stroke-width="0.5" fill="none"/></svg></div>
          <div class="rankup-title">ENFORCER</div>
          <div class="rankup-sub">Rank 4 of 7 · Your driving speaks for itself</div>
          <div class="rankup-perks">
            <div class="rankup-perk">Unlocked G-Force Analytics</div>
            <div class="rankup-perk">Priority in Leaderboards</div>
            <div class="rankup-perk">+500 XP Bonus</div>
          </div>
          <button class="btn btn-matrix">CONTINUE</button>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
