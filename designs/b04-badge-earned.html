<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Badge Earned — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // BADGE_EARNED</div>
<div class="scanlines"></div>
        <div class="screen-dark">
          <div class="badge-overlay">
            <div class="badge-star" style="margin-bottom:16px"><svg viewBox="0 0 24 24" fill="rgba(0,255,65,.08)" stroke="var(--matrix)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:72px;height:72px;filter:drop-shadow(0 0 20px var(--matrix-glow))"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div>
            <div class="badge-name">SMOOTH OPERATOR</div>
            <div class="badge-desc">Completed 5 km with zero harsh braking events</div>
            <div class="xp-gain" style="margin:16px 0 0">+150 XP Earned</div>
            <div class="badge-cta">TAP TO CONTINUE</div>
          </div>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
