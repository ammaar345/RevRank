<!DOCTYPE html>

            <div class="lboard-name">nitro_rider99<br><span style="font-size:11px;color:var(--text-dim)">GTI_Mk7</span></div>
            <div class="lboard-score">98</div>
          </div>
          <div class="lboard-row me">
            <div class="lboard-rank" style="color:var(--matrix)">8</div>
            <div class="lboard-avatar" style="border-color:var(--matrix)">@</div>
            <div class="lboard-name">speedster99<br><span style="font-size:11px;color:var(--text-dim)">BMW M240i</span></div>
            <div class="lboard-score" style="color:var(--matrix)">91</div>
          </div>
          <div class="lboard-row">
            <div class="lboard-rank">42</div>
            <div class="lboard-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M5 17H3l1.5-4.5L6 9h12l1.5 3.5L21 17h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/><path d="M9 9l1-3h4l1 3"/></svg></div>

          <div class="lboard-row">
            <div class="lboard-rank">103</div>
            <div class="lboard-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M4 17H2l1-4 2-5h8l2 5h2l1 4h-2"/><rect x="14" y="5" width="6" height="5" rx="1"/><circle cx="6" cy="17" r="2"/><circle cx="16" cy="17" r="2"/><path d="M8 17h6"/></svg></div>

        <div class="bottom-nav">
          <button><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="2"/></svg><span class="nav-label">TRACK</span><span class="nav-dot"></span></button><button><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><polyline points="12,6 12,12 16,14"/></svg><span class="nav-label">HISTORY</span><span class="nav-dot"></span></button><button class="active"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4a2 2 0 01-2-2V5a2 2 0 012-2h2"/><path d="M18 9h2a2 2 0 002-2V5a2 2 0 00-2-2h-2"/><path d="M6 3h12v7a6 6 0 01-12 0z"/><path d="M12 16v5"/><path d="M8 21h8"/></svg><span class="nav-label">RANK</span><span class="nav-dot"></span></button><button><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="nav-label">PROFILE</span><span class="nav-dot"></span></button>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
