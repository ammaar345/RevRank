<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Empty · No Trips — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // EMPTY_NO_TRIPS</div>
<div class="screen-bg"><img src="../A_high-resolution,_detailed_vertical_image_202606290631.jpeg" alt=""><div class="bg-fade"></div><div class="bg-glow"></div></div>
<div class="scanlines"></div>
        <div class="screen" style="align-items:center;justify-content:center;text-align:center">
          <div style="margin-bottom:16px">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--matrix)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:64px;height:64px;filter:drop-shadow(0 0 12px var(--matrix-glow))" role="img" aria-label="No trips"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M6 15.8V9a3 3 0 013-3h6.7" stroke-dasharray="2.5 3.5"/></svg>
          </div>
          <div style="font-family:var(--font-mono);font-size:16px;letter-spacing:2px;margin-bottom:8px">NO TRIPS YET</div>
          <div style="font-size:12px;color:var(--text-dim);max-width:240px;margin-bottom:32px;line-height:1.6">Take your first drive to get your score.</div>
          <button class="btn btn-matrix">START TRACKING</button>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
