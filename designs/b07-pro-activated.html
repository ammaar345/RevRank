<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pro Activated — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // PRO_ACTIVATED</div>
<div class="scanlines"></div>
        <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px">
          <div class="glow-center"></div>
          <div style="font-family:var(--font-display);font-size:14px;color:var(--matrix);letter-spacing:6px;margin-bottom:16px;text-transform:uppercase">PRO ACTIVATED</div>
          <div style="position:relative;width:100px;height:100px;display:flex;align-items:center;justify-content:center;margin-bottom:24px">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--matrix)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:64px;height:64px;filter:drop-shadow(0 0 20px var(--matrix));animation:unlockGlow 4s ease-in-out infinite">
              <polygon id="lock-body" points="12,2 20,6 20,18 12,22 4,18 4,6" opacity="0" />
              <path id="shackle" d="M9 9V7a3 3 0 016 0v2" opacity="0" />
              <path id="checkmark" d="M7 13l3 3 7-7" stroke-width="2.5" stroke-dasharray="20" stroke-dashoffset="0" />
              <circle cx="12" cy="12" r="10" opacity="0.15" />
            </svg>
          </div>
          <style>
            @keyframes unlockGlow{0%{filter:drop-shadow(0 0 4px var(--matrix))}50%{filter:drop-shadow(0 0 24px var(--matrix))}100%{filter:drop-shadow(0 0 4px var(--matrix))}}
          </style>
          <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:2px;color:var(--matrix);text-transform:uppercase">LEGEND</div>
          <div style="font-size:12px;color:var(--text-dim);margin-top:8px">All features unlocked. Drive well.</div>
          <div style="font-size:9px;color:var(--text-faint);margin-top:40px;animation:pulse 2s infinite">AUTO-DISMISSING...</div>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
