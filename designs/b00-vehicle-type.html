<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vehicle Type — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // VEHICLE_TYPE</div>
<div class="scanlines"></div>
        <div class="screen">
          <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;padding-top:8px">VEHICLE TYPE</div>
          <div style="font-family:var(--font-mono);font-size:22px;margin-bottom:24px">What do you drive?</div>
          <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:24px">
            <div style="border:1px solid var(--matrix);padding:14px 16px;display:flex;align-items:center;gap:12px;background:rgba(0,255,65,.05)">
              <svg viewBox="0 0 24 24" fill="none" stroke="var(--matrix)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;flex-shrink:0"><path d="M5 17H3l1.5-4.5L6 9h12l1.5 3.5L21 17h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M3 17h2M19 17h2"/></svg><div><div style="font-family:var(--font-mono);font-size:14px">SEDAN / COUPE</div><div style="font-size:11px;color:var(--text-dim)">Most personal vehicles</div></div>
            </div>
            <div style="border:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;flex-shrink:0;color:var(--text-dim)"><path d="M5 17H3l1.5-4.5L6 9h12l1.5 3.5L21 17h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><rect x="10" y="3" width="4" height="3" rx="1"/></svg><div><div style="font-family:var(--font-mono);font-size:14px">RIDESHARE</div><div style="font-size:11px;color:var(--text-dim)">Uber / Lyft drivers</div></div>
            </div>
            <div style="border:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px;flex-shrink:0;color:var(--text-dim)"><path d="M4 17H2l1-4 2-5h8l2 5h2l1 4h-2"/><rect x="14" y="5" width="6" height="5" rx="1"/><circle cx="6" cy="17" r="2"/><circle cx="16" cy="17" r="2"/></svg><div><div style="font-family:var(--font-mono);font-size:14px">TRUCK / SUV</div><div style="font-size:11px;color:var(--text-dim)">Larger vehicles</div></div>
            </div>
          </div>
          <button class="btn btn-ghost">SKIP FOR NOW</button>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
