<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Loading · Skeletons — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // LOADING_SKELETONS</div>
<div class="screen-bg"><img src="../A_high-resolution,_detailed_vertical_image_202606290631.jpeg" alt=""><div class="bg-fade"></div><div class="bg-glow"></div></div>
<div class="scanlines"></div>
        <div class="screen" style="gap:0;position:relative">
          <canvas id="matrix-rain" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0.12;pointer-events:none;z-index:0"></canvas>
          <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px;color:var(--text-dim);position:relative;z-index:1">LOADING...</div>
          <!-- Skeleton rows (all z-index:1 to appear above rain) -->
          <div style="display:flex;gap:12px;margin-bottom:20px;position:relative;z-index:1">
            <div style="width:36px;height:36px;background:var(--track);border-radius:var(--radius-sm);animation:pulse 1.5s infinite"></div>
            <div style="flex:1">
              <div style="height:12px;width:60%;background:var(--track);border-radius:var(--radius-pill);margin-bottom:8px"></div>
              <div style="height:10px;width:40%;background:var(--track);border-radius:var(--radius-pill)"></div>
            </div>
          </div>
          <div style="display:flex;gap:12px;margin-bottom:20px;position:relative;z-index:1">
            <div style="width:36px;height:36px;background:var(--track);border-radius:var(--radius-sm);animation:pulse 1.5s infinite 0.2s"></div>
            <div style="flex:1">
              <div style="height:12px;width:50%;background:var(--track);border-radius:var(--radius-pill);margin-bottom:8px"></div>
              <div style="height:10px;width:35%;background:var(--track);border-radius:var(--radius-pill)"></div>
            </div>
          </div>
          <div style="display:flex;gap:12px;margin-bottom:20px;position:relative;z-index:1">
            <div style="width:36px;height:36px;background:var(--track);border-radius:var(--radius-sm);animation:pulse 1.5s infinite 0.4s"></div>
            <div style="flex:1">
              <div style="height:12px;width:55%;background:var(--track);border-radius:var(--radius-pill);margin-bottom:8px"></div>
              <div style="height:10px;width:45%;background:var(--track);border-radius:var(--radius-pill)"></div>
            </div>
          </div>
          <div style="height:120px;background:var(--track);border-radius:var(--radius-sm);margin-bottom:20px;animation:pulse 1.5s infinite 0.6s;position:relative;z-index:1"></div>
          <div style="height:40px;width:100%;background:var(--track);border-radius:var(--radius-pill);animation:pulse 1.5s infinite 0.8s;position:relative;z-index:1"></div>
        </div>
</div>
<script>
(function(){
  const c = document.getElementById('matrix-rain');
  if(!c) return;
  const ctx = c.getContext('2d');
  let W, H;
  function resize(){ W=c.width=c.offsetWidth; H=c.height=c.offsetHeight; }
  resize();
  window.addEventListener('resize', resize);
  const cols = Math.floor(W/14);
  const drops = Array(cols).fill(1);
  const chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜ0123456789';
  function draw(){
    ctx.fillStyle='rgba(0,0,0,0.05)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#00FF41';
    ctx.font='12px monospace';
    for(let i=0;i<drops.length;i++){
      const text = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(text,i*14,drops[i]*14);
      if(drops[i]*14>H && Math.random()>0.975) drops[i]=0;
      drops[i]++;
    }
  }
  setInterval(draw, 50);
})();
</script>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
