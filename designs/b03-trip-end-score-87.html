<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trip End · Score 87 — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // TRIP_END_SCORE_87</div>
<div class="screen-bg"><img src="../A_high-resolution,_detailed_vertical_image_202606290631.jpeg" alt=""><div class="bg-fade"></div><div class="bg-glow"></div></div>
<div class="scanlines"></div>
        <div class="screen" style="align-items:center">
          <div class="score-status">A — GREAT</div>
          <div class="glow-center"></div>
            <div class="score-radial">
            <svg viewBox="0 0 80 80"><circle class="track" cx="40" cy="40" r="36"/><circle class="fill" cx="40" cy="40" r="36"/></svg>
            <div class="score-text">
              <div class="score-val">87</div>
              <div class="score-sub">OVERALL</div>
            </div>
          </div>
          <div class="xp-gain">+135 XP  ·  +24 km</div>
          <div class="score-stats">
            <div class="score-stat"><div class="score-stat-title">DISTANCE</div><div class="score-stat-val">24 km</div></div>
            <div class="score-stat"><div class="score-stat-title">DURATION</div><div class="score-stat-val">37 min</div></div>
            <div class="score-stat"><div class="score-stat-title">MAX SPEED</div><div class="score-stat-val">118 km/h</div></div>
            <div class="score-stat"><div class="score-stat-title">AVG SPEED</div><div class="score-stat-val">62 km/h</div></div>
          </div>
          <div class="score-bars">
            <div class="score-bar-row">
              <div class="score-bar-label">ACCEL</div>
              <div class="score-bar-track"><div class="score-bar-fill" style="width:78%;background:#FFD700"></div></div>
              <div class="score-bar-val" style="color:#FFD700">78</div>
            </div>
            <div class="score-bar-row">
              <div class="score-bar-label">BRAKE</div>
              <div class="score-bar-track"><div class="score-bar-fill" style="width:85%;background:var(--matrix)"></div></div>
              <div class="score-bar-val" style="color:var(--matrix)">85</div>
            </div>
            <div class="score-bar-row">
              <div class="score-bar-label">CORNERING</div>
              <div class="score-bar-track"><div class="score-bar-fill" style="width:88%;background:var(--matrix)"></div></div>
              <div class="score-bar-val" style="color:var(--matrix)">88</div>
            </div>
            <div class="score-bar-row">
              <div class="score-bar-label">SMOOTH</div>
              <div class="score-bar-track"><div class="score-bar-fill" style="width:91%;background:#39FF14"></div></div>
              <div class="score-bar-val" style="color:#39FF14">91</div>
            </div>
          </div>
          <button class="btn btn-matrix">SHARE</button>
          <button class="btn btn-ghost">VIEW FULL ANALYSIS</button>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
