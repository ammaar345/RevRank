<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Slide 2 · How You Drive — RevRank</title>
  <link rel="stylesheet" href="../revrank-theme.css">
  <link rel="stylesheet" href="screen-skin.css">
</head>
<body>
<div class="crt-scanlines crt-scanlines--phosphor"></div>
<div class="crt-vignette crt-vignette--tinted"></div>
<div class="crt-retrace"></div>
<div class="hud-bg"></div>

<div id="phone-frame">
<div class="rain-layer" id="rain-layer"></div>
<div class="term-tag">REVRANK // SLIDE_2_HOW_YOU_DRIVE</div>
<div class="scanlines"></div>
        <div class="onboarding">
          <div class="ob-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--matrix)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="44" height="44">
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="10.5" opacity="0.3" />
              <line x1="12" y1="3" x2="12" y2="4.5" />
              <line x1="12" y1="19.5" x2="12" y2="21" />
              <line x1="3" y1="12" x2="4.5" y2="12" />
              <line x1="19.5" y1="12" x2="21" y2="12" />
              <path d="M12 12l3 3" />
              <path d="M12 12l-2-4" />
              <circle cx="12" cy="12" r="1.5" fill="var(--matrix)" />
            </svg>
          </div>
          <div class="ob-head">KNOW HOW<br>YOU DRIVE.</div>
          <div class="ob-body">See every trip scored. Acceleration, braking, cornering, and more. All free forever.</div>
          <div class="ob-dots"><span></span><span class="active"></span><span></span></div>
          <button class="btn btn-matrix">NEXT</button>
          <div class="ob-skip">Skip</div>
        </div>
</div>

<script src="../revrank-theme.js"></script>
<script>
(function(){
  var r=document.getElementById('rain-layer');
  if(r&&window.RevRank&&RevRank.MatrixRain){
    new RevRank.MatrixRain(r,{density:0.45,speed:0.55,fontSize:12,idleOpacity:0.10,color:'#00FF66',headColor:'#AAFFCC',tailLength:10}).start();
  }
  if(window.RevRank&&RevRank.GlitchScheduler){
    new RevRank.GlitchScheduler('.term-tag',{variant:'random',audio:false,minInterval:5000,maxInterval:9000}).start();
  }
})();
</script>
</body>
</html>
